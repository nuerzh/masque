name: release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      platform:
        description: "选择构建环境"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - macos
          - linux
          - android
          - docker
          - all

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------
  # Windows desktop target
  #
  # Windows x86_64 is built natively on windows-latest.
  # ARM64 MSVC is intentionally not built because it has not been
  # verified on a real ARM64 Windows machine.
  #
  # Every build creates the pluggable transports first and ships them
  # in a pt/ folder beside the binary.
  # ------------------------------------------------------------------
  windows:
    name: Build aether-windows-x86_64.zip

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'windows' ||
      inputs.platform == 'all'

    runs-on: windows-latest

    defaults:
      run:
        working-directory: aether

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "Aether.zip" `
            -DestinationPath "." `
            -Force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build pluggable transports
        shell: bash
        run: |
          bash ../pt-build.sh \
            windows \
            amd64 \
            "$PWD/pt"

      - name: Build psiphon
        shell: bash
        run: |
          bash ../psiphon-build.sh \
            windows \
            amd64 \
            "$PWD/pt"

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --features tor \
            --target x86_64-pc-windows-msvc

      - name: Package archive
        shell: pwsh
        run: |
          Copy-Item `
            -Recurse `
            -Force `
            pt `
            target/x86_64-pc-windows-msvc/release/pt

          Compress-Archive `
            -Path `
              target/x86_64-pc-windows-msvc/release/aether.exe, `
              target/x86_64-pc-windows-msvc/release/pt, `
              run-aether.bat `
            -DestinationPath `
              aether-windows-x86_64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-x86_64.zip
          path: aether/aether-windows-x86_64.zip
          if-no-files-found: error


  # ------------------------------------------------------------------
  # macOS desktop targets
  #
  # macOS uses macos-latest.
  #
  # Both Apple Silicon ARM64 and Intel x86_64 binaries are built.
  # ------------------------------------------------------------------
  macos:
    name: Build ${{ matrix.archive }}

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'macos' ||
      inputs.platform == 'all'

    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          # ------------------------------------------------------------
          # Apple Silicon
          # ------------------------------------------------------------
          - target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            archive: aether-macos-arm64.tar.gz

          # ------------------------------------------------------------
          # Intel
          # ------------------------------------------------------------
          - target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            archive: aether-macos-x86_64.tar.gz

    defaults:
      run:
        working-directory: aether

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Build pluggable transports
        shell: bash
        run: |
          bash ../pt-build.sh \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }} \
            "$PWD/pt"

      - name: Build psiphon
        shell: bash
        run: |
          bash ../psiphon-build.sh \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }} \
            "$PWD/pt"

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --features tor \
            --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp -R \
            pt \
            target/${{ matrix.target }}/release/pt

          cd target/${{ matrix.target }}/release

          tar -czf \
            ../../../${{ matrix.archive }} \
            aether \
            pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error


  # ------------------------------------------------------------------
  # Linux targets
  #
  # Linux x86_64 is built on an x86_64 runner.
  # Linux ARM64 is built on a native ARM64 runner.
  #
  # Both use fedora:latest.
  # ------------------------------------------------------------------
  linux:
    name: Build ${{ matrix.archive }}

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'

    runs-on: ${{ matrix.os }}

    container:
      image: fedora:latest

    strategy:
      fail-fast: false
      matrix:
        include:

          # ------------------------------------------------------------
          # Linux x86_64
          # ------------------------------------------------------------
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64.tar.gz

          # ------------------------------------------------------------
          # Linux ARM64
          # ------------------------------------------------------------
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            archive: aether-linux-arm64.tar.gz

    defaults:
      run:
        working-directory: aether

    steps:
      - name: Install system dependencies (Fedora)
        working-directory: /
        run: |
          dnf -y install \
            gcc gcc-c++ make cmake ninja-build golang nasm clang \
            perl perl-FindBin perl-IPC-Cmd \
            curl git tar gzip xz unzip findutils which

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Install Rust (latest stable via rustup)
        working-directory: /
        run: |
          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs \
            | sh -s -- \
              -y \
              --default-toolchain stable \
              --profile minimal

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust target
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build pluggable transports
        run: |
          bash ../pt-build.sh \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }} \
            "$PWD/pt"

      - name: Build psiphon
        run: |
          bash ../psiphon-build.sh \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }} \
            "$PWD/pt"

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --features tor \
            --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp -R \
            pt \
            target/${{ matrix.target }}/release/pt

          cd target/${{ matrix.target }}/release

          tar -czf \
            ../../../${{ matrix.archive }} \
            aether \
            pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error


  # ------------------------------------------------------------------
  # Linux ARMv7
  #
  # Cross-compiled on ubuntu-latest with the gnueabihf toolchain.
  # ------------------------------------------------------------------
  linux-armv7:
    name: Build aether-linux-armv7.tar.gz

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aether

    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      - name: Build pluggable transports
        run: |
          bash ../pt-build.sh \
            linux \
            arm \
            "$PWD/pt" \
            7

      - name: Build psiphon
        run: |
          bash ../psiphon-build.sh \
            linux \
            arm \
            "$PWD/pt" \
            7

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --features tor \
            --target armv7-unknown-linux-gnueabihf

      - name: Package archive
        run: |
          cp -R \
            pt \
            target/armv7-unknown-linux-gnueabihf/release/pt

          cd target/armv7-unknown-linux-gnueabihf/release

          tar -czf \
            ../../../aether-linux-armv7.tar.gz \
            aether \
            pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-armv7.tar.gz
          path: aether/aether-linux-armv7.tar.gz
          if-no-files-found: error


  # ------------------------------------------------------------------
  # Linux ARMv7 MUSL
  #
  # Fully static build for OpenWrt and other musl-based systems.
  # ------------------------------------------------------------------
  linux-armv7-musl:
    name: Build aether-linux-armv7-musl.tar.gz

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aether

    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CC_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CXX_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-g++
      AR_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-ar
      BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_musleabihf: --target=armv7-unknown-linux-musleabihf --sysroot=/opt/musl-cross/armv7-unknown-linux-musleabihf
      RUSTFLAGS: --cfg libc_unstable_musl_v1_2_3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl \
            -fsSL \
            https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz \
            -o /tmp/musl-cross.tar.xz

          sudo mkdir -p /opt/musl-cross

          sudo tar \
            -C /opt/musl-cross \
            --strip-components=1 \
            -xJf /tmp/musl-cross.tar.xz

      - name: Build pluggable transports
        run: |
          bash ../pt-build.sh \
            linux \
            arm \
            "$PWD/pt" \
            7

      - name: Build psiphon
        run: |
          bash ../psiphon-build.sh \
            linux \
            arm \
            "$PWD/pt" \
            7

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --features tor \
            --target armv7-unknown-linux-musleabihf

      - name: Package archive
        run: |
          cp -R \
            pt \
            target/armv7-unknown-linux-musleabihf/release/pt

          cd target/armv7-unknown-linux-musleabihf/release

          tar -czf \
            ../../../aether-linux-armv7-musl.tar.gz \
            aether \
            pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-armv7-musl.tar.gz
          path: aether/aether-linux-armv7-musl.tar.gz
          if-no-files-found: error


  # ------------------------------------------------------------------
  # Linux x86_64 + ARM64 MUSL
  #
  # Fully static builds for OpenWrt and other musl-based systems.
  # ------------------------------------------------------------------
  linux-musl:
    name: Build ${{ matrix.archive }}

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aether

    strategy:
      fail-fast: false
      matrix:
        include:

          # ------------------------------------------------------------
          # x86_64 MUSL
          # ------------------------------------------------------------
          - target: x86_64-unknown-linux-musl
            cross_prefix: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64-musl.tar.gz

          # ------------------------------------------------------------
          # ARM64 MUSL
          # ------------------------------------------------------------
          - target: aarch64-unknown-linux-musl
            cross_prefix: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
            archive: aether-linux-aarch64-musl.tar.gz

    env:
      RUST_LIBC_UNSTABLE_MUSL_V1_2_3: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl \
            -fsSL \
            https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz \
            -o /tmp/musl-cross.tar.xz

          sudo mkdir -p /opt/musl-cross

          sudo tar \
            -C /opt/musl-cross \
            --strip-components=1 \
            -xJf /tmp/musl-cross.tar.xz

      - name: Set up cross env vars
        run: |
          triple=$(echo "${{ matrix.target }}" | tr '-' '_')
          prefix=/opt/musl-cross/bin/${{ matrix.cross_prefix }}

          echo "CARGO_TARGET_${triple^^}_LINKER=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CC_${triple}=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CXX_${triple}=${prefix}-g++" >> "$GITHUB_ENV"
          echo "AR_${triple}=${prefix}-ar" >> "$GITHUB_ENV"

          echo "BINDGEN_EXTRA_CLANG_ARGS_${triple}=--target=${{ matrix.target }} --sysroot=/opt/musl-cross/${{ matrix.cross_prefix }}" >> "$GITHUB_ENV"

      - name: Build pluggable transports
        run: |
          bash ../pt-build.sh \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }} \
            "$PWD/pt"

      - name: Build psiphon
        run: |
          bash ../psiphon-build.sh \
            ${{ matrix.goos }} \
            ${{ matrix.goarch }} \
            "$PWD/pt"

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --features tor \
            --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp -R \
            pt \
            target/${{ matrix.target }}/release/pt

          cd target/${{ matrix.target }}/release

          tar -czf \
            ../../../${{ matrix.archive }} \
            aether \
            pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error


  # ------------------------------------------------------------------
  # Android / Termux targets
  #
  # Built using Android NDK + cargo-ndk.
  #
  # The pluggable transports are built as static Linux binaries because
  # CGO is not required for those binaries and they run as-is under
  # Android / Termux.
  # ------------------------------------------------------------------
  android:
    name: Build ${{ matrix.archive }}

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'android' ||
      inputs.platform == 'all'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          # ------------------------------------------------------------
          # Android ARM64
          # ------------------------------------------------------------
          - abi: arm64-v8a
            target: aarch64-linux-android
            goarch: arm64
            goarm: ""
            archive: aether-android-arm64.tar.gz

          # ------------------------------------------------------------
          # Android ARMv7
          # ------------------------------------------------------------
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            goarch: arm
            goarm: "7"
            archive: aether-android-armv7.tar.gz

          # ------------------------------------------------------------
          # Android x86_64
          # ------------------------------------------------------------
          - abi: x86_64
            target: x86_64-linux-android
            goarch: amd64
            goarm: ""
            archive: aether-android-x86_64.tar.gz

    defaults:
      run:
        working-directory: aether

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --locked

      - name: Build pluggable transports
        run: |
          bash ../pt-build.sh \
            linux \
            ${{ matrix.goarch }} \
            "$PWD/pt" \
            "${{ matrix.goarm }}"

      - name: Build psiphon
        run: |
          bash ../psiphon-build.sh \
            linux \
            ${{ matrix.goarch }} \
            "$PWD/pt" \
            "${{ matrix.goarm }}"

      - name: Build release binary
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t ${{ matrix.abi }} \
            --platform 24 \
            build \
            --release \
            --features tor

      - name: Package archive
        run: |
          cp -R \
            pt \
            target/${{ matrix.target }}/release/pt

          cd target/${{ matrix.target }}/release

          tar -czf \
            ../../../${{ matrix.archive }} \
            aether \
            pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error


  # ------------------------------------------------------------------
  # Docker
  # ------------------------------------------------------------------
  docker:
    name: Build and push Docker image

    if: |
      github.event_name == 'push' ||
      inputs.platform == 'docker' ||
      inputs.platform == 'all'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unzip archive
        run: |
          unzip -o Aether.zip -d .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        shell: bash
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # ------------------------------------------------------------------
  # GitHub Release
  #
  # Only runs when a v* tag is pushed.
  #
  # Manual workflow_dispatch runs only generate artifacts and do not
  # create a GitHub Release.
  # ------------------------------------------------------------------
  release:
    name: Publish release

    needs:
      - windows
      - macos
      - linux
      - linux-armv7
      - linux-armv7-musl
      - linux-musl
      - android

    runs-on: ubuntu-latest

    permissions:
      contents: write

    if: |
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob

          files=(
            *.tar.gz
            *.zip
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done

          sha256sum "${files[@]}" > SHA256SUMS.txt

          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt
